name: process-sheets-jobs

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Process queued Google Sheets jobs
        env:
          AQRAT_RUNTIME_URL: ${{ vars.AQARAT_RELEASE_URL }}
          JOB_RUNNER_SECRET: ${{ secrets.JOB_RUNNER_SECRET }}
        run: |
          set -eu
          test -n "$AQRAT_RUNTIME_URL"
          test -n "$JOB_RUNNER_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            -X POST \
            -H 'content-type: application/json' \
            -H "x-job-runner-secret: $JOB_RUNNER_SECRET" \
            "$AQRAT_RUNTIME_URL/api/jobs/sheets"
