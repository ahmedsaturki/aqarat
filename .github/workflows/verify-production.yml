name: verify-production

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: aqarat-production-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run tests and syntax checks
        run: npm run check

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEEP_HEALTH_SECRET: ${{ secrets.DASHBOARD_ADMIN_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify public release contract
        env:
          AQARAT_RELEASE_URL: ${{ vars.AQARAT_RELEASE_URL }}
        run: |
          set -eu
          test -n "$AQARAT_RELEASE_URL"
          node scripts/verify-release.mjs
      - name: Run authenticated deep health check
        if: env.DEEP_HEALTH_SECRET != ''
        env:
          AQARAT_RELEASE_URL: ${{ vars.AQARAT_RELEASE_URL }}
        run: |
          set -eu
          test -n "$AQARAT_RELEASE_URL"
          # Do not retry a 503 from deep health here: one 429 from Gemini
          # would otherwise become three provider requests and amplify quota pressure.
          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            -H "x-aqarat-health-secret: ${DEEP_HEALTH_SECRET}" \
            "${AQARAT_RELEASE_URL}/api/healthz/deep"
      - name: Report deep health skipped when secret is unavailable
        if: env.DEEP_HEALTH_SECRET == ''
        run: echo 'DASHBOARD_ADMIN_SECRET is not configured in GitHub production environment; deep external-provider health check skipped.'
