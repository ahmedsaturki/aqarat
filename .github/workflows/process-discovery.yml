name: process-discovery

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    concurrency:
      group: aqarat-discovery-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run discovery worker
        env:
          SUPABASE_URL: https://aaxauqznfhcvgevfczye.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCOVERY_WORKER_NAME: github-actions-discovery
        run: node src/discovery/worker-http.mjs
