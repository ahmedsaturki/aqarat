name: process-discovery

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/process-discovery.yml'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: aqarat-discovery-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Drain canonical discovery queue
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCOVERY_WORKER_NAME: github-actions-discovery
        run: |
          set -eu
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          set +e
          failures=0
          for attempt in 1 2 3 4 5 6; do
            echo "=== CANONICAL DISCOVERY QUEUE PASS ${attempt}/6 ==="
            node src/discovery/worker-http.mjs
            rc=$?
            if [ "$rc" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          done
          echo "DISCOVERY_FAILURE_PASSES=$failures"
          exit "$failures"
