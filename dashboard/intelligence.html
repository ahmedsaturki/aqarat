<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aqarat OS — Intelligence</title><link rel="stylesheet" href="/dashboard/styles.css"></head>
<body>
<div class="app-shell"><main class="main" style="max-width:1200px;margin:auto;width:100%">
<header class="topbar"><div><h1>🧠 Aqarat Intelligence</h1><p>Opportunity · Freshness · Buyer Matching — deterministic and explainable</p></div><a class="tag" href="/dashboard/">العودة للوحة</a></header>
<section id="login" class="card auth-card"><h2>تسجيل دخول المشغّل</h2><p class="muted">هذه صفحة داخلية، نفس جلسة لوحة التحكم.</p><form id="loginForm"><label for="password">كلمة مرور المشغّل</label><input id="password" type="password" autocomplete="current-password" placeholder="Dashboard Admin Secret" required><button>دخول</button><div id="loginError" class="error" role="alert" aria-live="polite"></div></form></section>
<section id="app" hidden><div class="grid metrics" id="summary" aria-live="polite"></div><section class="card panel"><div class="card-head"><h2>أفضل الفرص</h2><span class="tag">Explainable</span></div><div id="opportunities"></div></section><section id="matches" class="card panel" hidden><div class="card-head"><h2>أفضل تطابقات المشترين</h2><span class="tag">Property Match</span></div><div id="matchBody"></div></section></section>
</main></div>
<script>
const $=s=>document.querySelector(s);const login=$('#login'),app=$('#app');
const CLIENT_REQUEST_TIMEOUT_MS=10000;
async function clientFetch(url,options={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort('timeout'),CLIENT_REQUEST_TIMEOUT_MS);try{return await fetch(url,{...options,signal:controller.signal})}catch(error){if(error?.name==='AbortError'||controller.signal.aborted){const timeout=new Error(controller.signal.reason==='timeout'?'CLIENT_TIMEOUT':'CLIENT_ABORTED');timeout.cause=error;throw timeout}throw error}finally{clearTimeout(timer)}}
const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function table(head,rows){return `<div class="table-wrap"><table><thead><tr>${head.map(esc).map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
async function load(){const r=await clientFetch('/api/dashboard/intelligence');if(r.status===401)throw Error('AUTH');if(!r.ok)throw Error('INTEL');const d=await r.json();const scores=d.opportunities||[];const avg=scores.length?scores.reduce((a,x)=>a+x.score,0)/scores.length:0;$('#summary').innerHTML=[['Opportunities',scores.length],['Avg score',Math.round(avg*100)+'%'],['Fresh',scores.filter(x=>x.freshness>=.7).length],['Stale',scores.filter(x=>x.reasons.includes('stale_listing')).length]].map(([k,v])=>`<article class="card metric"><span>${esc(k)}</span><strong>${esc(v)}</strong></article>`).join('');$('#opportunities').innerHTML=table(['Property','Score','Freshness','Confidence','Completeness','Reasons'],scores.map(x=>`<tr><td>${esc(x.title||x.property_id)}</td><td>${Math.round(x.score*100)}%</td><td>${Math.round(x.freshness*100)}%</td><td>${Math.round(x.confidence*100)}%</td><td>${Math.round(x.completeness*100)}%</td><td>${esc(x.reasons.join(', '))}</td></tr>`));}
async function boot(){try{await load();login.hidden=true;app.hidden=false}catch(e){if(e.message!=='AUTH'){const message=e.message==='CLIENT_TIMEOUT'?'انتهت مهلة الاتصال. حاول مرة أخرى.':'تعذر تحميل Intelligence.';$('#loginError').textContent=message;}}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const r=await clientFetch('/api/dashboard/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#password').value})});if(!r.ok){$('#loginError').textContent='بيانات الدخول غير صحيحة.';return}await boot()};boot();
</script></body></html>
